<!DOCTYPE html>
<html lang="fr" data-theme="neon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Arcade — la salle de jeux</title>
<meta name="description" content="Une petite plateforme de jeux d'arcade en HTML, CSS et JavaScript purs : Neon Snake, Neon 2048, succès, skins et statistiques.">
<meta name="theme-color" content="#0b0f1a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230b0f1a'/><circle cx='11' cy='16' r='4' fill='%2338f9c3'/><rect x='18' y='12' width='8' height='8' rx='2' fill='%23ffd166'/></svg>">
<!-- ?v= : incrémenter à chaque modification d'un fichier de src/ pour forcer
     les navigateurs à recharger les assets au lieu de servir leur cache. -->
<link rel="stylesheet" href="src/core/ui.css?v=16">
<link rel="stylesheet" href="src/hub/hub.css?v=16">
</head>
<body class="page-hub">
<div class="hall">

  <header class="hall-head">
    <h1 class="hall-title">Neon <span>Arcade</span></h1>
    <p class="hall-tagline">Une salle de jeux sans dépendance.</p>
  </header>

  <section class="profile" aria-label="Progression tous jeux confondus">
    <span class="profile-label">Ta progression</span>
    <div class="tiles" id="profile"></div>
    <div class="progress-bar" style="margin-top:12px">
      <div class="progress-fill" id="profileFill" style="width:0"></div>
    </div>
  </section>

  <nav class="games" id="games" aria-label="Jeux"></nav>

  <footer class="hall-foot">Progression enregistrée dans ce navigateur uniquement.</footer>

</div>

<script src="src/core/storage.js?v=16"></script>
<script src="src/core/progress.js?v=16"></script>
<script src="src/games/registry.js?v=16"></script>
<script src="src/games/snake/manifest.js?v=16"></script>
<script src="src/games/snake/legacy.js?v=16"></script>
<script src="src/games/2048/manifest.js?v=16"></script>
<script src="src/games/bricks/manifest.js?v=16"></script>
<script src="src/games/mines/manifest.js?v=16"></script>
<script src="src/games/four/manifest.js?v=16"></script>
<script src="src/games/blocks/manifest.js?v=16"></script>
<script src="src/games/crates/manifest.js?v=16"></script>
<script src="src/games/meow/manifest.js?v=16"></script>
<script src="src/games/cells/manifest.js?v=16"></script>
<script src="src/hub/hub.js?v=16"></script>
</body>
</html>
